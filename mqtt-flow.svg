<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-label="Animated MQTT data flow: ESP32 to Mosquitto broker to Raspberry Pi to dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .t   { font-size: 13px; fill: #8B949E; }
    .nm  { font-size: 15px; fill: #E6EDF3; font-weight: 700; text-anchor: middle; }
    .sub { font-size: 11px; fill: #8B949E; text-anchor: middle; }
    .tp  { font-size: 10px; fill: #3FB950; text-anchor: middle; }
    .log { font-size: 13px; fill: #3FB950; }
    .box { fill: #0D1117; stroke-width: 2; }
    .flow { stroke: url(#line); stroke-width: 2; stroke-dasharray: 6 6; fill: none; opacity: .7; }
  </style>

  <rect width="840" height="250" rx="14" fill="url(#bg)" stroke="#30363D"/>

  <!-- window dots -->
  <circle cx="26" cy="24" r="5" fill="#F85149"/>
  <circle cx="44" cy="24" r="5" fill="#D29922"/>
  <circle cx="62" cy="24" r="5" fill="#3FB950"/>
  <text x="84" y="28" class="t">smartroom — live data flow</text>

  <!-- connection lines (dashes move) -->
  <path id="p1" class="flow" d="M150 115 H250">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <path id="p2" class="flow" d="M360 115 H460">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <path id="p3" class="flow" d="M570 115 H670">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- topic labels -->
  <text x="200" y="102" class="tp">publish</text>
  <text x="410" y="102" class="tp">subscribe</text>
  <text x="620" y="102" class="tp">realtime</text>

  <!-- packets -->
  <g filter="url(#glow)" fill="#58A6FF">
    <circle r="5"><animateMotion dur="1.8s" repeatCount="indefinite" path="M150 115 H250"/></circle>
    <circle r="5" fill="#3FB950"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" path="M360 115 H460"/></circle>
    <circle r="5" fill="#F0883E"><animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" path="M570 115 H670"/></circle>
  </g>

  <!-- node 1: ESP32 -->
  <rect class="box" x="40" y="80" width="110" height="70" rx="12" stroke="#1F6FEB"/>
  <text x="95" y="112" class="nm">ESP32</text>
  <text x="95" y="130" class="sub">sensors</text>

  <!-- node 2: broker (pulse) -->
  <rect class="box" x="250" y="80" width="110" height="70" rx="12" stroke="#3FB950"/>
  <rect x="250" y="80" width="110" height="70" rx="12" fill="none" stroke="#3FB950" stroke-width="2">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;8;2" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="305" y="112" class="nm">MQTT</text>
  <text x="305" y="130" class="sub">Mosquitto</text>

  <!-- node 3: Raspberry Pi -->
  <rect class="box" x="460" y="80" width="110" height="70" rx="12" stroke="#F0883E"/>
  <text x="515" y="112" class="nm">Pi</text>
  <text x="515" y="130" class="sub">PHP + MySQL</text>

  <!-- node 4: dashboard -->
  <rect class="box" x="670" y="80" width="110" height="70" rx="12" stroke="#A371F7"/>
  <text x="725" y="112" class="nm">Dashboard</text>
  <text x="725" y="130" class="sub">monitor</text>
  <!-- tiny bars -->
  <g fill="#A371F7">
    <rect x="698" y="138" width="5" height="6"><animate attributeName="height" values="6;2;6" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="138;142;138" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="708" y="138" width="5" height="6"><animate attributeName="height" values="2;6;2" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="142;138;142" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="718" y="138" width="5" height="6"><animate attributeName="height" values="6;3;6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="138;141;138" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="728" y="138" width="5" height="6"><animate attributeName="height" values="3;6;3" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="141;138;141" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="738" y="138" width="5" height="6"><animate attributeName="height" values="6;2;6" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="138;142;138" dur="1.3s" repeatCount="indefinite"/></rect>
  </g>

  <!-- live log -->
  <text x="40" y="200" class="t">$ mosquitto_sub -t "smartroom/#"</text>
  <g>
    <text x="40" y="225" class="log" opacity="0">&gt; temp=28.4C  humidity=61%
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="225" class="log" opacity="0">&gt; presence=1  light=412lx
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="225" class="log" opacity="0">&gt; power=86W  relay=ON
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
    <rect x="330" y="214" width="8" height="14" fill="#3FB950">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
